# Render Blueprint: 보글 API 서버(server/)를 Render 웹 서비스 하나로 배포한다.
# 처음 배포하는 방법과 주의점은 docs/render-deploy.md 에 있다.
services:
  - type: web
    name: bogle-api
    runtime: python
    # Supabase(서울)와 가장 가까운 Render 리전. 서비스를 만든 뒤에는 바꿀 수 없다.
    region: singapore
    # 0.5 CPU·512MB(옛 Starter). free는 15분 동안 요청이 없으면 잠들어 내부 워커가 멈춘다.
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: pip install .
    # 내부 워커와 메모리 횟수 제한 때문에 프로세스 하나(--workers 1)로만 띄운다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /v1/health
    # 같은 이유로 인스턴스도 하나만 둔다. 자동 확장(scaling)을 켜지 않는다.
    numInstances: 1
    # main에 올라온 커밋 중 CI가 통과한 것만 배포한다.
    autoDeployTrigger: checksPass
    envVars:
      # CI와 같은 Python 3.11. 이 변수는 패치 버전까지 적어야 한다.
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      # 비밀 값은 Blueprint를 처음 만들 때 Render 화면에서 입력한다. 저장소에는 두지 않는다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
