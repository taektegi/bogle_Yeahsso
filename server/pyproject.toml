[project]
name = "bogle-server"
version = "0.1.0"
description = "보글 백엔드 API 서버"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "psycopg[binary,pool]>=3.2",
  # Supabase Storage REST 호출. 최신 Starlette의 TestClient도 이것을 요구한다 (httpx는 deprecated)
  "httpx2>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
