[project]
name = "bogle-server"
version = "0.1.0"
description = "보글 백엔드 API 서버"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "psycopg[binary,pool]>=3.2",
  # Asia/Seoul 시간대. Windows에는 시스템 시간대 DB가 없어서 필요하다.
  "tzdata>=2024.1",
  # Supabase Storage REST 호출. 최신 Starlette의 TestClient도 이것을 요구한다 (httpx는 deprecated)
  "httpx2>=2",
  # 업로드 multipart 읽기
  "python-multipart>=0.0.18",
  # 이미지 검사·후처리(배경 제거·자르기·썸네일·대표색·얼굴 위치 검증)
  "pillow>=11",
  "numpy>=2",
  # 캐릭터 그림·얼굴 위치·소개 문구·대화·검열
  "openai>=1.60",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
