# TorchServe for the two Animated Drawings models; paths are relative to
# motion_server/ (run.sh starts it from there).
inference_address=http://127.0.0.1:8080
management_address=http://127.0.0.1:8081
metrics_address=http://127.0.0.1:8082
model_store=.vendor/model-store
load_models=all
default_workers_per_model=1
